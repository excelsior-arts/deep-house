    <text class="name" x="935.0" y="692" text-anchor="middle">Params</text>
    <path class="ln thin" d="M760 704 H1110"/>
    <text class="det" x="778" y="726">measured tunables</text>
  </g>
  <g>
    <rect class="box" x="1195" y="110" width="250" height="152" rx="3"/>
    <rect class="icon" x="1405" y="124" width="26" height="18"/>
    <rect class="icon" x="1399" y="127" width="12" height="5"/>
    <rect class="icon" x="1399" y="134" width="12" height="5"/>
    <text class="ster" x="1320.0" y="134" text-anchor="middle">&#171;page&#187;</text>
    <text class="name" x="1320.0" y="162" text-anchor="middle">Ring</text>
    <path class="ln thin" d="M1195 174 H1445"/>
    <text class="det" x="1213" y="196">band — the mix ahead</text>
    <text class="det" x="1213" y="221">cells — the dice</text>
    <text class="det" x="1213" y="246">centre — play, cast</text>
  </g>
  <g>
    <rect class="box" x="1195" y="456" width="250" height="76" rx="3"/>
    <rect class="icon" x="1405" y="470" width="26" height="18"/>
    <rect class="icon" x="1399" y="473" width="12" height="5"/>
