  </g>
  <g>
    <rect class="box" x="70" y="110" width="590" height="102" rx="3"/>
    <text class="ster" x="365.0" y="134" text-anchor="middle">&#171;input&#187;</text>
    <text class="name" x="365.0" y="162" text-anchor="middle">Master seed</text>
    <path class="ln thin" d="M70 174 H660"/>
    <text class="det" x="88" y="196">one number — the whole night follows from it</text>
  </g>
  <g>
    <rect class="box" x="70" y="242" width="590" height="102" rx="3"/>
    <rect class="icon" x="620" y="256" width="26" height="18"/>
    <rect class="icon" x="614" y="259" width="12" height="5"/>
    <rect class="icon" x="614" y="266" width="12" height="5"/>
    <text class="ster" x="365.0" y="266" text-anchor="middle">&#171;generator&#187;</text>
    <text class="name" x="365.0" y="294" text-anchor="middle">Theme seeds</text>
    <path class="ln thin" d="M70 306 H660"/>
    <text class="det" x="88" y="328">seed # n, one after another; one tempo all night</text>
  </g>
  <g>
    <rect class="box" x="70" y="374" width="590" height="127" rx="3"/>
    <rect class="icon" x="620" y="388" width="26" height="18"/>
    <rect class="icon" x="614" y="391" width="12" height="5"/>
    <rect class="icon" x="614" y="398" width="12" height="5"/>
    <text class="ster" x="365.0" y="398" text-anchor="middle">&#171;generator&#187;</text>
    <text class="name" x="365.0" y="426" text-anchor="middle">Dice</text>
    <path class="ln thin" d="M70 438 H660"/>
    <text class="det" x="88" y="460">room · key · tempo · timbre</text>
    <text class="det" x="88" y="485">density · effects · wet · figures</text>
  </g>
  <g>
