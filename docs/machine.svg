<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1140" width="1500" height="1140" role="img" aria-label="A component diagram: a master seed becomes theme seeds and dice, the dice become a plan and a track of events, the track is played by synthesised voices on two decks through a mix chain to the audio output, and the ring reads the mix; an inset sequence diagram shows the seam between two decks.">
  <style>
    .paper { fill: #ffffff; }
    .ln { fill: none; stroke: #111111; stroke-linecap: butt; stroke-linejoin: miter; }
    .thin { stroke-width: 1.6; }
    .flow { stroke-width: 2.2; }
    .head { stroke-width: 2.2; }
    .dep  { stroke-width: 2.2; stroke-dasharray: 9 7; }
    .life { stroke-width: 1.6; stroke-dasharray: 7 7; }
    .box  { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .icon { fill: #ffffff; stroke: #111111; stroke-width: 1.6; }
    .pkg  { fill: #f1f0ed; stroke: #8b8b86; stroke-width: 1.8; }
    .frame { fill: none; stroke: #111111; stroke-width: 1.8; }
    .act  { fill: #ffffff; stroke: #111111; stroke-width: 1.8; }
    text {
      font-family: system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      fill: #111111;
    }
    .pkgname { font-size: 25px; font-weight: 600; }
    .ster { font-size: 20px; fill: #444444; }
    .name { font-size: 27px; font-weight: 600; }
    .det  { font-size: 21px; fill: #222222; }
    .msg  { font-size: 20px; fill: #111111; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
    .leg  { font-size: 21px; fill: #111111; }
    .legttl { font-size: 24px; font-weight: 600; }
  </style>
  <rect class="paper" x="0" y="0" width="1500" height="1140"/>
  <g>
    <rect class="pkg" x="30" y="70" width="670" height="770"/>
    <rect class="pkg" x="30" y="36" width="94" height="34"/>
    <text class="pkgname" x="47" y="59">Plan</text>
  </g>
  <g>
    <rect class="pkg" x="730" y="70" width="410" height="770"/>
    <rect class="pkg" x="730" y="36" width="109" height="34"/>
    <text class="pkgname" x="747" y="59">Sound</text>
  </g>
  <g>
    <rect class="pkg" x="1170" y="70" width="300" height="770"/>
    <rect class="pkg" x="1170" y="36" width="94" height="34"/>
