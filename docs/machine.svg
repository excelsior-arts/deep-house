    <path class="ln thin" d="M70 595 H660"/>
    <text class="det" x="88" y="617">progression — chord motions, second-order Markov table</text>
    <text class="det" x="88" y="642">figures — bass, hat and stab masks, mined</text>
    <text class="det" x="88" y="667">arrangement — sections in eight-bar phrases</text>
  </g>
  <g>
    <rect class="box" x="70" y="713" width="590" height="102" rx="3"/>
    <text class="ster" x="365.0" y="737" text-anchor="middle">&#171;artifact&#187;</text>
    <text class="name" x="365.0" y="765" text-anchor="middle">Track</text>
    <path class="ln thin" d="M70 777 H660"/>
    <text class="det" x="88" y="799">events and automation curves — no audio yet</text>
  </g>
  <g>
